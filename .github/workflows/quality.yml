name: GitUnstuck quality
on:
  push:
    branches: [v2.0]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source, content, public build and disposable Git checks
        run: |
          npm test
          npm run check
          npm run build
      - name: Install Chromium on CI runner
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile baseline observations
        env:
          BASELINE_FIXTURE: '1'
        run: node tests/baseline-browser.cjs
      - name: Learning and help experience regression
        run: node tests/experience-browser.cjs
      - name: Save rendered experience for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-screenshots
          path: test-results/experience
          retention-days: 7
