name: GitUnstuck quality
on:
  push:
    branches: [v2.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source and disposable Git baseline
        run: node --test tests/*.test.mjs
      - name: Install isolated browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/gitunstuck-browser" --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium on CI runner
        run: node "$RUNNER_TEMP/gitunstuck-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile baseline observations
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/gitunstuck-browser/node_modules/playwright
          BASELINE_FIXTURE: '1'
        run: node tests/baseline-browser.cjs
      - name: Corrected behavior regression
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/gitunstuck-browser/node_modules/playwright
        run: node tests/baseline-browser.cjs
